name: Deploy Nebula

on:
  push:
    branches: [main]
  schedule:
    # horas locales de España; reintentos para recuperar posibles retrasos
    - cron: "0,5,15 9,10,11,12,14 * * *"
      timezone: "Europe/Madrid"
    # actualizo el cambio de día de la portada
    - cron: "5 0 * * *"
      timezone: "Europe/Madrid"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          node-version: 22
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
