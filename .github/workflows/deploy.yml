name: Deploy Nebula


on:
  push:
    branches: [main]
  schedule:
    # horarios UTC, equivalentes al invierno español
    - cron: "0,15,30 8,9,10,11,12,13,14,15,16 * * *"
    - cron: "5 23 * * *"
  workflow_dispatch:


permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          node-version: 22
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
